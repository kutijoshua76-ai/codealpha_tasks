{% extends 'core/base.html' %}
{% block title %}Login – VibeNet{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card glass">
        <h2>Sign in to VibeNet</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" class="form-input" title="Username" placeholder="Enter your username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" class="form-input" title="Password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-primary w-full">Log In</button>
        </form>
        <p class="auth-footer">
            New here? <a href="{% url 'signup' %}">Join the vibe</a>
        </p>
    </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    fetch('{% url "login" %}', {
        method: 'POST',
        headers: { 'X-CSRFToken': getCookie('csrftoken'), 'Content-Type': 'application/json' },
        body: JSON.stringify({
            username: document.getElementById('login-username').value,
            password: document.getElementById('login-password').value
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) window.location.href = '{% url "index" %}';
        else alert(data.error);
    });
});
</script>
{% endblock %}
