{% extends 'core/base.html' %}
{% block title %}Sign Up – VibeNet{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card glass">
        <h2>Join VibeNet</h2>
        <form id="signup-form">
            <div class="form-group">
                <label for="signup-username">Username</label>
                <input type="text" id="signup-username" class="form-input" title="Username" placeholder="Choose a username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" class="form-input" title="Email address" placeholder="your@email.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" class="form-input" title="Password" placeholder="Create a strong password" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn-primary w-full">Create Account</button>
        </form>
        <p class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </p>
    </div>
</div>

<script>
document.getElementById('signup-form').addEventListener('submit', function(e) {
    e.preventDefault();
    fetch('{% url "signup" %}', {
        method: 'POST',
        headers: { 'X-CSRFToken': getCookie('csrftoken'), 'Content-Type': 'application/json' },
        body: JSON.stringify({
            username: document.getElementById('signup-username').value,
            email: document.getElementById('signup-email').value,
            password: document.getElementById('signup-password').value
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) window.location.href = '{% url "index" %}';
        else alert(data.error);
    });
});
</script>
{% endblock %}
